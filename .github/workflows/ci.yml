name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, unit tests, cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - name: UI script parses
        run: node --check internal/ui/web/app.js
      - name: rclone command list is current
        run: ./scripts/gen-rclonecli.sh && git diff --exit-code internal/rclonecli
      - name: Unit tests (race)
        run: go test -race -count=1 ./...
      - name: Vet every target
        run: |
          set -e
          for t in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${t%/*}"; arch="${t#*/}"; tags=""
            [ "$os" = windows ] && tags="-tags cmount"
            echo "== $t"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go vet $tags ./...
          done
      - name: Cross-compile release targets
        run: OUT=dist ./scripts/build.sh 0.0.0-ci
      # The same script the release runs, so packaging breaks here, not on a tag.
      - name: Package the Linux builds
        run: ./scripts/package-linux.sh 0.0.0-ci
      - name: Install the .deb and run it
        run: |
          sudo apt-get update
          sudo apt-get install -y ./out/enter-space-light_*_amd64.deb
          command -v esl
          esl version | grep -F "0.0.0"
          test -f /usr/share/applications/enter-space-light.desktop

  android:
    name: Android app (build and lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v5.0.0
        with:
          distribution: temurin
          java-version: "17"
      # The device tests need an emulator; Soren runs those (soren.config.mjs).
      - name: Build the engine and the APK
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ./scripts/build-android.sh 0.0.0-ci debug
      - name: Lint, and compile the device tests
        working-directory: android
        run: ./gradlew --no-daemon -q lintDebug assembleDebugAndroidTest

  e2e-linux:
    name: End-to-end, real FUSE mount (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - name: Install FUSE
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3
          ls -l /dev/fuse
      - name: End-to-end
        env:
          ESL_E2E_MOUNT: "1"
        run: go test -tags e2e -count=1 -timeout 15m -run TestE2E -v ./internal/daemon
      - name: A drive this process serves can be used by this process
        run: go test -tags e2e -count=5 -timeout 5m ./internal/linuxmount

  e2e-windows:
    name: End-to-end, real WinFsp mount (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - name: Install pinned WinFsp (checksum-verified)
        shell: pwsh
        run: |
          Get-Content packaging/windows/winfsp.env | Where-Object { $_ -match '^[A-Z0-9_]+=' } | ForEach-Object {
            $k, $v = $_ -split '=', 2; Set-Item "env:$($k.Trim())" $v.Trim()
          }
          if (-not $env:WINFSP_MSI_URL -or -not $env:WINFSP_MSI_SHA256) { throw "winfsp.env was not read" }
          Invoke-WebRequest $env:WINFSP_MSI_URL -OutFile winfsp.msi
          $sum = (Get-FileHash winfsp.msi -Algorithm SHA256).Hash.ToLower()
          if ($sum -ne $env:WINFSP_MSI_SHA256) { throw "WinFsp checksum mismatch: $sum" }
          $p = Start-Process msiexec.exe -ArgumentList '/i','winfsp.msi','/qn','/norestart' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "WinFsp install failed: $($p.ExitCode)" }
      - name: End-to-end
        env:
          ESL_E2E_MOUNT: "1"
          CGO_ENABLED: "0" # as release builds: cgofuse loads the WinFsp DLL at runtime, no headers needed
        run: go test -tags e2e,cmount -count=1 -timeout 15m -run TestE2E -v ./internal/daemon
